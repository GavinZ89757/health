<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2e7d5e">
<title>肿瘤康复助手</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--primary:#2e7d5e;--bg:#f4f8f6;--card:#fff;--text:#1a2e25;--muted:#6b7c74;--border:#ddebe3;--danger:#c0392b;--warn:#e67e22}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-tap-highlight-color:transparent}
header{background:var(--primary);color:#fff;padding:1rem;position:sticky;top:0;z-index:100;text-align:center}
header h1{font-size:1.2rem;font-weight:600}
nav.tabs{display:flex;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:3.2rem;z-index:99;overflow-x:auto;-webkit-overflow-scrolling:touch}
nav.tabs button{flex:1;min-width:80px;padding:.75rem .5rem;background:0 0;border:0;border-bottom:2px solid transparent;font-size:.85rem;color:var(--muted);white-space:nowrap}
nav.tabs button.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
main{padding:.75rem;max-width:720px;margin:0 auto;padding-bottom:5rem}
.view-head{margin-bottom:.75rem}
.view-head h2{font-size:1.1rem;color:var(--primary)}
.view-head p{font-size:.85rem;color:var(--muted)}
.card{background:var(--card);border-radius:12px;padding:1rem;margin-bottom:.75rem;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.card h2{font-size:1rem;margin-bottom:.75rem;color:var(--primary)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.field{display:flex;flex-direction:column;gap:.25rem;margin-bottom:.75rem}
.field-label{font-size:.8rem;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{width:100%;padding:.6rem .75rem;border:1px solid var(--border);border-radius:8px;font-size:.95rem;background:#fff;color:var(--text);-webkit-appearance:none}
.field textarea{resize:vertical;min-height:60px}
.file-btn{display:inline-block;padding:.6rem 1rem;border:2px dashed var(--border);border-radius:8px;background:#fafbfa;color:var(--muted);font-size:.9rem;text-align:center;cursor:pointer;width:100%}
.file-btn:active{background:var(--border)}
button.primary{width:100%;padding:.75rem;background:var(--primary);color:#fff;border:0;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;margin-top:.5rem}
button.primary:active{opacity:.85}
.list{list-style:none}
.list-item{display:flex;align-items:center;gap:.5rem;padding:.6rem 0;border-bottom:1px solid var(--border)}
.list-item:last-child{border-bottom:0}
.chip{font-size:.75rem;padding:.15rem .5rem;background:var(--bg);border-radius:4px;color:var(--muted)}
.empty-tip{text-align:center;color:var(--muted);padding:1.5rem;font-size:.9rem}
.err{color:var(--danger);font-size:.85rem;margin-top:.5rem}
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:center;justify-content:center;padding:1rem}
.modal-mask[hidden]{display:none}
.modal{background:#fff;border-radius:12px;padding:1.25rem;max-width:90vw;max-height:85vh;overflow:auto;width:100%}
.modal-actions{display:flex;gap:.5rem;margin-top:1rem}
.modal-actions button{flex:1;padding:.6rem;border-radius:8px;border:1px solid var(--border);background:#fff;cursor:pointer}
.toast{position:fixed;bottom:5rem;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);color:#fff;padding:.6rem 1.2rem;border-radius:8px;font-size:.9rem;z-index:300;pointer-events:none;transition:opacity .3s}
.toast[hidden]{opacity:0;display:none}
@media(prefers-color-scheme:dark){:root{--bg:#1a1a2e;--card:#16213e;--text:#e0e0e0;--muted:#8899a6;--border:#2a4a3e}}
</style>
</head>
<body>

<header><h1>🌿 肿瘤康复助手</h1></header>

<nav class="tabs" role="tablist">
  <button role="tab" id="t-reports" aria-selected="true" onclick="switchTab('reports')">📄 报告</button>
  <button role="tab" id="t-treatments" aria-selected="false" onclick="switchTab('treatments')">💉 治疗</button>
  <button role="tab" id="t-symptoms" aria-selected="false" onclick="switchTab('symptoms')">📋 症状</button>
  <button role="tab" id="t-meds" aria-selected="false" onclick="switchTab('meds')">💊 用药</button>
  <button role="tab" id="t-markers" aria-selected="false" onclick="switchTab('markers')">📊 指标</button>
</nav>

<main id="main"></main>

<div class="modal-mask" id="modal" hidden><div class="modal" id="modalBody"></div></div>
<div class="toast" id="toast" hidden></div>

<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
